name: Bug report
description: Report an observable failure using fictional data only
title: "Bug: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps with fictional data
      description: Never include employer, customer, employee, product or production records.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, Python version and operating system
    validations:
      required: true
