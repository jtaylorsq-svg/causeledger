<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><rect width="1440" height="960" fill="#f2f5f8"/><rect width="1440" height="95" fill="#102b48"/><g font-family="Arial,sans-serif"><text x="55" y="60" font-size="32" fill="white" font-weight="bold">CauseLedger</text><text x="330" y="58" font-size="18" fill="#c6d6e7">Close corrective actions with evidence.</text><text x="55" y="145" font-size="13" letter-spacing="2" fill="#60778e">ILLUSTRATIVE DEMO STORYBOARD · NOT AN APPLICATION SCREENSHOT</text><text x="55" y="200" font-size="34" fill="#19334e" font-weight="bold">A completed action is not proof that it worked.</text><text x="55" y="241" font-size="18" fill="#60778e">Fictional washer omission case · One facilitator · Explicit occurrence and escape paths</text><rect x="55" y="280" width="1330" height="90" rx="10" fill="white" stroke="#dbe4ed"/><circle cx="100" cy="325" r="24" fill="#155b92"/><text x="100" y="331" text-anchor="middle" font-size="17" fill="white">01</text><text x="148" y="319" font-size="19" font-weight="bold" fill="#19334e">Evidence</text><text x="148" y="344" font-size="14" fill="#637b91">Lot reconciliation</text><text x="590" y="331" font-size="17" fill="#314d68">60 held · 3 reworked · 60 rechecked</text><rect x="55" y="386" width="1330" height="90" rx="10" fill="white" stroke="#dbe4ed"/><circle cx="100" cy="431" r="24" fill="#155b92"/><text x="100" y="437" text-anchor="middle" font-size="17" fill="white">02</text><text x="148" y="425" font-size="19" font-weight="bold" fill="#19334e">Failure mechanism</text><text x="148" y="450" font-size="14" fill="#637b91">Fixture permits omission</text><text x="590" y="437" font-size="17" fill="#314d68">Handwheel can assemble with empty washer pocket</text><rect x="55" y="492" width="1330" height="90" rx="10" fill="white" stroke="#dbe4ed"/><circle cx="100" cy="537" r="24" fill="#155b92"/><text x="100" y="543" text-anchor="middle" font-size="17" fill="white">03</text><text x="148" y="531" font-size="19" font-weight="bold" fill="#19334e">Verified cause</text><text x="148" y="556" font-size="14" fill="#637b91">Two paths, two tests</text><text x="590" y="543" font-size="17" fill="#314d68">Occurrence challenge + escape challenge</text><rect x="55" y="598" width="1330" height="90" rx="10" fill="white" stroke="#dbe4ed"/><circle cx="100" cy="643" r="24" fill="#155b92"/><text x="100" y="649" text-anchor="middle" font-size="17" fill="white">04</text><text x="148" y="637" font-size="19" font-weight="bold" fill="#19334e">Corrective action</text><text x="148" y="662" font-size="14" fill="#637b91">Prevention + detection</text><text x="590" y="649" font-size="17" fill="#314d68">Presence pin + validated inspection check</text><rect x="55" y="704" width="1330" height="90" rx="10" fill="#fff2dc" stroke="#dea54c"/><circle cx="100" cy="749" r="24" fill="#a65a0b"/><text x="100" y="755" text-anchor="middle" font-size="17" fill="white">05</text><text x="148" y="743" font-size="19" font-weight="bold" fill="#19334e">Effectiveness</text><text x="148" y="768" font-size="14" fill="#637b91">One gap still open</text><text x="590" y="755" font-size="17" fill="#314d68">Escape check follow-up result is missing</text><rect x="55" y="840" width="1330" height="65" rx="8" fill="#102b48"/><text x="85" y="880" font-size="19" fill="white">CLOSURE BLOCKED</text><text x="365" y="880" font-size="17" fill="#d5e4f2">Record accepted effectiveness evidence before closing the investigation.</text><text x="55" y="938" font-size="13" fill="#60778e">All examples are fictional. Software records human judgment; it does not establish physical truth or certify compliance.</text></g></svg>